name: Release

# Tag a commit `vX.Y.Z` (matching MARKETING_VERSION in project.yml) to build, sign,
# notarize and publish Stint-X.Y.Z.zip as a GitHub release.
#
# Repository secrets:
#   MACOS_CERT_P12_BASE64        Developer ID Application identity (.p12), base64
#   MACOS_CERT_PASSWORD          password of that .p12
#   APP_STORE_CONNECT_KEY_P8     App Store Connect API key (.p8 contents)
#   APP_STORE_CONNECT_KEY_ID     its key ID
#   APP_STORE_CONNECT_ISSUER_ID  its issuer ID

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run TimeCore tests
        run: swift test
        working-directory: TimeCore

      - name: Check tag matches MARKETING_VERSION
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml)
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$version in project.yml" >&2; exit 1; }

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "no Developer ID Application identity in the .p12" >&2; exit 1; }

      - name: Build, sign, notarize, staple
        env:
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY_P8" > "$NOTARY_KEY_PATH"
          scripts/release.sh
          rm -f "$NOTARY_KEY_PATH"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/Stint-*.zip \
            --title "Stint ${GITHUB_REF_NAME#v}" --generate-notes
