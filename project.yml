name: Stint
options:
  bundleIdPrefix: io.artnim
  deploymentTarget:
    macOS: "14.0"
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  TimeCore:
    path: TimeCore
targets:
  Stint:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - package: TimeCore
        product: TimeCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Stint
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: io.artnim.stint
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "0.2.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # local builds: automatic signing with the development team (iCloud needs a real identity)
        Debug:
          # checked-in plists (xcodegen's generated entitlements would override a per-config path): Debug = development push
          CODE_SIGN_ENTITLEMENTS: App/Stint.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 76C3CLR3D5
          ENABLE_HARDENED_RUNTIME: false
        # distribution: Developer ID + hardened runtime + secure timestamp, notarized by scripts/release.sh
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: 76C3CLR3D5
          # Release entitlements: push = production, CloudKit = Production (base entitlements are not injected)
          CODE_SIGN_ENTITLEMENTS: App/Stint.release.entitlements
          PROVISIONING_PROFILE_SPECIFIER: "Stint Developer ID"
          ENABLE_HARDENED_RUNTIME: true
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # `xcodebuild build` otherwise injects get-task-allow, which notarization rejects
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
  StintMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Mobile
      - Shared
      - path: App/Assets.xcassets
    dependencies:
      - package: TimeCore
        product: TimeCore
      - target: StintWatch
    info:
      path: Mobile/Info.plist
      properties:
        CFBundleDisplayName: Stint
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
    entitlements:
      path: Mobile/StintMobile.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.io.artnim.stint]
        com.apple.developer.icloud-services: [CloudKit]
        # same container environment as the notarized Mac, even for a phone installed from Xcode
        com.apple.developer.icloud-container-environment: Production
        keychain-access-groups: [76C3CLR3D5.io.artnim.stint]
        aps-environment: development
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: io.artnim.stint.ios
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 76C3CLR3D5
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StintWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Watch
      - WatchShared
      - path: App/Assets.xcassets
    dependencies:
      - package: TimeCore
        product: TimeCore
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Stint
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: io.artnim.stint.ios
        WKRunsIndependentlyOfCompanionApp: true
    entitlements:
      path: Watch/StintWatch.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.io.artnim.stint]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-environment: Production
        com.apple.security.application-groups: [group.io.artnim.stint]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: io.artnim.stint.ios.watchkitapp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 76C3CLR3D5
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
# explicit shared schemes: xcodebuild -scheme needs them on a freshly generated project
# (Xcode's automatic per-target schemes only exist after the project was opened in Xcode)
schemes:
  Stint:
    build:
      targets:
        Stint: all
    run:
      config: Debug
    archive:
      config: Release
  StintMobile:
    build:
      targets:
        StintMobile: all
    run:
      config: Debug
    archive:
      config: Release
  StintWatch:
    build:
      targets:
        StintWatch: all
    run:
      config: Debug
    archive:
      config: Release
