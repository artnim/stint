name: Stint
options:
  bundleIdPrefix: io.artnim
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  TimeCore:
    path: TimeCore
targets:
  Stint:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: TimeCore
        product: TimeCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Stint
        LSUIElement: true
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/Stint.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: io.artnim.stint
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # local builds: ad-hoc signed, no certificate needed
        Debug:
          CODE_SIGN_IDENTITY: "-"
          ENABLE_HARDENED_RUNTIME: false
        # distribution: Developer ID + hardened runtime + secure timestamp, notarized by scripts/release.sh
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: 76C3CLR3D5
          ENABLE_HARDENED_RUNTIME: true
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # `xcodebuild build` otherwise injects get-task-allow, which notarization rejects
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
